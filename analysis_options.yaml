include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat missing awaits and dead code as errors — in an offline-first app a
    # dropped Future silently loses a local write or a queued sync.
    unawaited_futures: error
    dead_code: warning
  exclude:
    # Drift / build_runner output.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_single_quotes
    - prefer_final_locals
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_build_context_synchronously
